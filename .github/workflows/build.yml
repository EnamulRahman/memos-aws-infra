name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: memos

jobs:
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Terraform security
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          version: v1.28.14
          additional_args: --tfvars-file infra/terraform.tfvars

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or reuse image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          ERROR_FILE=$(mktemp)

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            > /dev/null 2>"$ERROR_FILE"; then
            echo "Image already exists; reusing $IMAGE"

          elif grep -q ImageNotFoundException "$ERROR_FILE"; then
            docker build -t "$IMAGE" .
            docker push "$IMAGE"

          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi

          rm -f "$ERROR_FILE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"